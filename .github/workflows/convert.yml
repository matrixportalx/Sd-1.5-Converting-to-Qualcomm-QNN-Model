name: Convert SD1.5 -> QNN

# ============================================================================
# QAIRT SDK (matrixportalx/qairt-sdk v2.39) release'ten OTOMATİK indirilir;
# artık runner'a önceden kurmaya gerek yok.
#
# Tek gerçek kısıt: RAM. QNN kuantizasyonu 512px için bile ~20 GB+ ister.
#   * GitHub ücretsiz runner (~7 GB): YETERSİZ.
#   * Seçenek A: SELF-HOSTED runner (kendi 32 GB+ Linux makineniz) — önerilen.
#   * Seçenek B: GitHub "larger runner" (ücretli, 16–64 GB) — runs-on'u değiştirin.
#
# Self-hosted kurulum (bir kez):
#   1. Depo -> Settings -> Actions -> Runners -> "New self-hosted runner".
#   2. Depo Secrets: HF_TOKEN (write), gerekiyorsa CIVITAI_TOKEN.
#      (qairt-sdk release public ise GH_TOKEN gerekmez; private ise ekleyin.)
#
# Çalıştırma: Actions sekmesi -> "Convert SD1.5 -> QNN" -> Run workflow.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      safetensors_url:
        description: "safetensors indirme linki (civitai / HF / düz link)"
        required: true
        type: string
      model_name:
        description: "Model adı (ör. AbsoluteReality)"
        required: true
        type: string
      tier:
        description: "Hedef tier (Snapdragon 7 için min)"
        required: true
        default: "min"
        type: choice
        options: ["min", "mid", "high"]
      resolutions:
        description: "Çözünürlükler"
        required: true
        default: "512x512"
        type: string
      qnn_version:
        description: "Çıktı sürüm etiketi (_qnn<sürüm>_min)"
        required: true
        default: "2.39"
        type: string
      hf_repo:
        description: "HF hedef repo (kullanici/repo). Boş = yükleme yok"
        required: false
        type: string

jobs:
  convert:
    # Self-hosted runner'ınıza "qnn" label'ı verdiyseniz bunu kullanın:
    #   runs-on: [self-hosted, linux, qnn]
    runs-on: [self-hosted, linux]
    timeout-minutes: 1440
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install python deps
        run: |
          pip install -r requirements.txt
          command -v mnnconvert >/dev/null || pip install MNN

      - name: Download QAIRT SDK from release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python scripts/setup_qnn_sdk.py \
            --repo matrixportalx/qairt-sdk \
            --tag v2.39.0.250926 \
            --dest ./qairt --github-env
          echo "QNN_SDK_ROOT=$QNN_SDK_ROOT"

      - name: Download model
        env:
          CIVITAI_TOKEN: ${{ secrets.CIVITAI_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/fetch_model.py \
            --url "${{ inputs.safetensors_url }}" \
            --output work/input.safetensors

      - name: Convert
        env:
          MNNCONVERT: mnnconvert
          QNN_VERSION: ${{ inputs.qnn_version }}
        run: |
          chmod +x convert_all.sh scripts/*.sh
          ./convert_all.sh work/input.safetensors \
            "${{ inputs.model_name }}" "${{ inputs.tier }}" "${{ inputs.resolutions }}"

      - name: Upload artifact (indirilebilir zip)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.model_name }}-qnn${{ inputs.qnn_version }}-${{ inputs.tier }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload to Hugging Face
        if: ${{ inputs.hf_repo != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ZIP=$(ls -1 dist/*.zip | head -n1)
          python scripts/upload_hf.py --repo "${{ inputs.hf_repo }}" --file "$ZIP"
